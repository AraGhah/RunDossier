services:
  api:
    build:
      context: ./RunDossier
      dockerfile: Dockerfile
    container_name: rundossier-api
    restart: unless-stopped
    env_file:
      - ./RunDossier/.env
    environment:
      DATABASE_SSL: "true"
      DATABASE_SSL_STRICT: "false"
      TRUST_PROXY: "true"
      CORS_ORIGINS: "https://getdossier.co,https://www.getdossier.co,http://localhost:5173"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
